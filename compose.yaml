x-base: &base
  image: sts-tiles
  user: "1000:1000"
  read_only: true
  tmpfs:
    - /tmp
  environment:
    HOME: /tmp

services:
  viewer:
    <<: *base
    build:
      context: ${STS_BUILD_CONTEXT:-.}
      args:
        VITE_MAPBOX_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
    container_name: sts-viewer
    command: ["serve"]
    mem_limit: 320m
    restart: unless-stopped
    environment:
      HOME: /tmp
      STS_PORT: "8080"
    ports:
      - "127.0.0.1:${VIEWER_PORT:-8090}:8080"
    volumes:
      - ${STS_DATA_DIR:-./data}:/data:ro

  watch:
    <<: *base
    container_name: sts-tiles-watch
    command: ["watch"]
    mem_limit: 400m
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ${STS_DATA_DIR:-./data}:/data

  listener:
    <<: *base
    profiles: ["ingest"]
    container_name: sts-tiles-listener
    command: ["listen"]
    env_file: .env
    mem_limit: 400m
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ${STS_DATA_DIR:-./data}:/data

  sync:
    <<: *base
    profiles: ["ingest"]
    command: ["run"]
    env_file: .env
    mem_limit: 400m
    restart: "no"
    volumes:
      - ${STS_DATA_DIR:-./data}:/data
